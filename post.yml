name: Daily Post

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-pango-1.0 \
            libpango1.0-dev \
            libgirepository1.0-dev \
            python3-cairo \
            python3-pil \
            python3-requests \
            fonts-sil-scheherazade

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages Pillow pycairo requests

      - name: Run post script
        env:
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPO:            ${{ github.repository }}
        run: python3 post.py

        - name: Test aldiwan scraper
        run: |
          python3 -c "
          import requests
          from bs4 import BeautifulSoup
          r = requests.get('https://www.aldiwan.net/poem1.html', timeout=10)
          print('status:', r.status_code)
          soup = BeautifulSoup(r.text, 'html.parser')
          print('title:', soup.title.text if soup.title else 'no title')
          print('html snippet:', r.text[1000:2000])
          "
